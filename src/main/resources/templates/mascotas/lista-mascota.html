<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
	<meta charset="UTF-8">
	<link rel="icon" type="image/png" sizes="192x192" href="/favicons/android-chrome-512x512.png">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Listado de Mascotas</title>
	<link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@500;600;700&family=Golos+Text:wght@400;500;600;700&display=swap" rel="stylesheet">
	<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
	<link rel="stylesheet" th:href="@{/css/common/navfooter.css}">
	<link rel="stylesheet" th:href="@{/css/mascotas/listadomascotas.css}">
</head>

<body>

	<header th:replace="~{common/navfooter :: navbar}"></header>

	<div class="mascotas-banner">
		<div class="mascotas-banner-overlay"></div>
		<div class="mascotas-banner-contenido">
			<h1 class="mascotas-banner-titulo">Listado de Mascotas</h1>
			<p class="mascotas-banner-subtitulo">Consulta todos los pacientes registrados en la cl&#237;nica</p>
		</div>
	</div>

	<main class="contenido-principal">

		<div class="cabecera-acciones">
			<a th:href="@{/mascotas/nueva}" class="boton-nuevo">
				<i class="fa-solid fa-plus"></i> Nueva Mascota
			</a>
			<div class="cabecera-contador">
				<span class="contador-numero" th:text="${mascotas.size()}">0</span>
				<span class="contador-label">Mascotas registradas</span>
			</div>
		</div>

		<div class="tarjeta-tabla">

			<!-- Barra superior: filtros + contador -->
			<div class="barra-superior">
				<form th:action="@{/mascotas/buscar}" method="get" class="formulario-filtros">
					<div class="input-busqueda">
						<i class="fa-solid fa-magnifying-glass"></i>
						<input type="text" name="nombre" th:value="${nombreSeleccionado}" placeholder="Nombre mascota...">
					</div>
					<select class="filtro-select" name="especie">
						<option value="">Especies</option>
						<option value="Perro" th:selected="${especieSeleccionada == 'Perro'}">Perro</option>
						<option value="Gato" th:selected="${especieSeleccionada == 'Gato'}">Gato</option>
						<option value="Ave" th:selected="${especieSeleccionada == 'Ave'}">Ave</option>
						<option value="Otro" th:selected="${especieSeleccionada == 'Otro'}">Otro</option>
					</select>
					<div class="input-busqueda">
						<input type="text" name="raza" th:value="${razaSeleccionada}" placeholder="Raza...">
					</div>
					<div class="input-busqueda">
						<input type="text" name="dueno" th:value="${duenoSeleccionado}" placeholder="Due&#241;o (Nombre)...">
					</div>
					<button type="submit" class="boton-filtrar">Buscar</button>
				</form>
				<div class="barra-derecha">
					<a th:href="@{/mascotas}" class="boton-limpiar">
						Limpiar
					</a>
				</div>
			</div>

			<div class="contenedor-tabla">
				<table class="tabla-mascotas">
					<thead>
						<tr>
							<th>Nombre</th>
							<th>Especie / Raza</th>
							<th>Fecha Nac.</th>
							<th>Due&#241;o</th>
							<th>Citas</th>
							<th>Acciones</th>
						</tr>
					</thead>
					<tbody>
						<tr th:each="m : ${mascotas}">
							<td class="col-nombre" th:text="${m.nombre}"></td>
							<td>
								<span class="etiqueta-especie" th:text="${m.especie}"></span>
								<span class="col-raza" th:text="${m.raza}"></span>
							</td>
							<td th:text="${#temporals.format(m.fechaNacimiento, 'dd/MM/yyyy')} ?: 'No registrada'"></td>
							<td th:text="${m.cliente?.usuario?.nombreCompleto} ?: 'Sin asignar'"></td>
							<td>
						    <a th:href="@{/citas(mascotaId=${m.id})}" class="enlace-historial" title="Ver historial clínico">
						        <span class="badge-citas" th:text="${m.cantidadCitas}">0</span>
						    </a>
						</td>
							<td class="col-acciones">
								<a th:href="@{/mascotas/editar/{id}(id=${m.id})}" class="boton-editar" title="Editar">
									<i class="fa-solid fa-pen"></i>
								</a>
								<a th:href="@{/mascotas/eliminar/{id}(id=${m.id})}" class="boton-eliminar"
									onclick="return confirm('&#191;Eliminar esta mascota?')" title="Eliminar">
									<i class="fa-solid fa-trash"></i>
								</a>
							</td>
						</tr>
					</tbody>
				</table>
			</div>

		</div>
	</main>

	<footer th:replace="~{common/navfooter :: pie}"></footer>

</body>
</html>
