<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head>
	<meta charset="UTF-8">
	<link rel="icon" type="image/png" sizes="192x192" href="/img/favicons/android-chrome-512x512.png">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Registrar Mascota</title>
	<link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@500;600;700&family=Golos+Text:wght@400;500;600;700&display=swap" rel="stylesheet">
	<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
	<link rel="stylesheet" th:href="@{/css/common/navfooter.css}">
	<link rel="stylesheet" th:href="@{/css/mascotas/formulariomascota.css}">
	<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
</head>

<body>
	<header th:replace="~{common/navfooter :: navbar}"></header>

	<main class="contenido-principal">

		<!-- Fondo slider -->
		<div class="fm-fondo">
			<div class="fm-slide activa"><img src="/img/portada/mascotas/mascotaha.jpg" alt=""></div>
			<div class="fm-slide"><img src="/img/portada/mascotas/mas7.jpg" alt=""></div>
			<div class="fm-slide"><img src="/img/portada/mascotas/mas6.jpg" alt=""></div>
			<div class="fm-overlay"></div>
		</div>

		<!-- Formulario centrado -->
		<div class="fm-pagina">
			<div class="fm-card">

				<div class="fm-card-header">
					<div>
						<h1 class="fm-titulo">Nueva mascota</h1>
						<p class="fm-sub">Completa la información del nuevo paciente</p>
					</div>
				</div>

				<form th:action="@{/mascotas/guardar}" th:object="${mascota}" method="post">

					<!-- Nombre | Especie -->
					<div class="fm-fila-dos">
						<div class="fm-campo">
							<label class="fm-label">Nombre</label>
							<input class="fm-input" type="text" th:field="*{nombre}" placeholder="Ej: Toby" required>
						</div>
						<div class="fm-campo">
							<label class="fm-label">Especie</label>
							<div class="fm-custom-select">
								<select class="fm-select" th:field="*{especie}" required>
									<option value="Perro">Perro</option>
									<option value="Gato">Gato</option>
									<option value="Ave">Ave</option>
									<option value="Otro">Otro</option>
								</select>
								<div class="fm-select-trigger">
									<span>Perro</span>
									<i class="fa-solid fa-chevron-down"></i>
								</div>
								<div class="fm-select-lista"></div>
							</div>
						</div>
					</div>

					<!-- Raza | Fecha de nacimiento -->
					<div class="fm-fila-dos">
						<div class="fm-campo">
							<label class="fm-label">Raza</label>
							<input class="fm-input" type="text" th:field="*{raza}" placeholder="Ej: Labrador">
						</div>
						<div class="fm-campo">
							<label class="fm-label">Fecha de nacimiento</label>
							<input class="fm-input" type="date" th:field="*{fechaNacimiento}">
						</div>
					</div>

					<!-- Propietario (solo admin) -->
					<div class="fm-campo fm-campo-full" sec:authorize="hasRole('admin')">
						<label class="fm-label">Asignar a cliente</label>
						<div class="fm-custom-select">
							<select class="fm-select" th:field="*{cliente}">
								<option value="">— Seleccionar cliente —</option>
								<option th:each="c : ${todosClientes}" th:value="${c.id}"
									th:text="${c.dni} + ' - ' + ${c.usuario.nombreCompleto}">
								</option>
							</select>
							<div class="fm-select-trigger">
								<span>— Seleccionar cliente —</span>
								<i class="fa-solid fa-chevron-down"></i>
							</div>
							<div class="fm-select-lista"></div>
						</div>
					</div>

					<div class="fm-acciones">
						<a th:href="@{/mascotas/mis-mascotas}" class="fm-link-volver">
							<i class="fa-solid fa-arrow-left"></i> Cancelar
						</a>
						<button type="submit" class="fm-btn">
							<i class="fa-solid fa-circle-check"></i>
							<span>Guardar mascota</span>
						</button>
					</div>

				</form>

			</div>
		</div>

	</main>

	<footer th:replace="~{common/navfooter :: pie}"></footer>

	<script>
		// Slider
		(function () {
			const slides = document.querySelectorAll('.fm-slide');
			let actual = 0;
			setInterval(function () {
				slides[actual].classList.remove('activa');
				actual = (actual + 1) % slides.length;
				slides[actual].classList.add('activa');
			}, 8000);
		})();

		// Custom selects
		document.querySelectorAll('.fm-custom-select').forEach(function (wrapper) {
			const realSelect = wrapper.querySelector('select');
			const trigger = wrapper.querySelector('.fm-select-trigger');
			const triggerText = trigger.querySelector('span');
			const lista = wrapper.querySelector('.fm-select-lista');

			// Construir opciones
			Array.from(realSelect.options).forEach(function (opt) {
				const div = document.createElement('div');
				div.className = 'fm-option' + (opt.selected ? ' seleccionado' : '');
				div.textContent = opt.text;
				div.dataset.value = opt.value;
				div.addEventListener('click', function () {
					realSelect.value = opt.value;
					triggerText.textContent = opt.text;
					lista.querySelectorAll('.fm-option').forEach(o => o.classList.remove('seleccionado'));
					div.classList.add('seleccionado');
					trigger.classList.remove('abierto');
					lista.classList.remove('abierto');
				});
				lista.appendChild(div);
			});

			// Texto inicial
			const seleccionado = realSelect.options[realSelect.selectedIndex];
			if (seleccionado) triggerText.textContent = seleccionado.text;

			// Abrir / cerrar
			trigger.addEventListener('click', function (e) {
				e.stopPropagation();
				trigger.classList.toggle('abierto');
				lista.classList.toggle('abierto');
			});

			// Cerrar al hacer clic fuera
			document.addEventListener('click', function () {
				trigger.classList.remove('abierto');
				lista.classList.remove('abierto');
			});
		});
	</script>
</body>
</html>
