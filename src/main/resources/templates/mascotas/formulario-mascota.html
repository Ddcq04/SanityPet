<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head>
	<meta charset="UTF-8">
	<link rel="icon" type="image/png" sizes="192x192" href="/img/favicons/android-chrome-512x512.png">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Registrar Mascota</title>
	<link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@500;600;700&family=Golos+Text:wght@400;500;600;700&display=swap" rel="stylesheet">
	<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
	<link rel="stylesheet" th:href="@{/css/common/navfooter.css}">
	<link rel="stylesheet" th:href="@{/css/mascotas/formulariomascota.css}">
	<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
</head>

<body>
	<header th:replace="~{common/navfooter :: navbar}"></header>

	<main class="contenido-principal">

		<!-- Fondo slider -->
		<div class="fm-fondo">
			<div class="fm-slide activa"><img src="/img/portada/mascotas/mascotaha.jpg" alt=""></div>
			<div class="fm-slide"><img src="/img/portada/mascotas/mas7.jpg" alt=""></div>
			<div class="fm-slide"><img src="/img/portada/mascotas/mas6.jpg" alt=""></div>
			<div class="fm-overlay"></div>
		</div>

		<!-- Formulario centrado -->
		<div class="fm-pagina">
			<div class="fm-card">
				<div class="fm-card-header">
					<div>
						<h1 class="fm-titulo" th:text="${mascota.id != null} ? 'Editar mascota' : 'Nueva mascota'">Nueva mascota</h1>
						<p class="fm-sub" th:text="${mascota.id != null} ? 'Modifica los datos del paciente seleccionado' : 'Completa la información del nuevo paciente'">Completa la información del nuevo paciente</p>
					</div>
				</div>

				<form th:action="@{/mascotas/guardar}" th:object="${mascota}" method="post">
					<input type="hidden" th:field="*{id}" />
					<!-- Nombre | Especie -->
					<div class="fm-fila-dos">
						<div class="fm-campo">
							<label class="fm-label">Nombre</label>
							<input class="fm-input" type="text" th:field="*{nombre}" placeholder="Ej: Toby" required>
						</div>
						<div class="fm-campo">
							<label class="fm-label">Especie</label>
							<div class="fm-custom-select">
								<select class="fm-select" th:field="*{especie}" required>
									<option value="Perro">Perro</option>
									<option value="Gato">Gato</option>
									<option value="Ave">Ave</option>
									<option value="Otro">Otro</option>
								</select>
								<div class="fm-select-trigger">
									<span>Perro</span>
									<i class="fa-solid fa-chevron-down"></i>
								</div>
								<div class="fm-select-lista"></div>
							</div>
						</div>
					</div>

					<!-- Raza | Fecha de nacimiento -->
					<div class="fm-fila-dos">
						<div class="fm-campo">
							<label class="fm-label">Raza</label>
							<input class="fm-input" type="text" th:field="*{raza}" placeholder="Ej: Labrador">
						</div>
						<div class="fm-campo">
						    <label class="fm-label">Fecha de nacimiento</label>
						    <input class="fm-input" 
						           type="date" 
						           th:id="fechaNacimiento"
						           th:name="fechaNacimiento"
						           th:value="${mascota.fechaNacimiento != null} ? ${#temporals.format(mascota.fechaNacimiento, 'yyyy-MM-dd')} : ''"
						           th:max="${#temporals.format(#temporals.createNow(), 'yyyy-MM-dd')}"
						           required>
						</div>
					</div>

					<!-- Propietario (solo admin) -->
					<div class="fm-campo fm-campo-full" sec:authorize="hasRole('admin')">
					    <label class="fm-label">Asignar a cliente</label>
					    
					    <input class="fm-input" 
					           type="text" 
					           id="clienteBuscador" 
					           list="datalistClientes" 
					           placeholder="— Escribe DNI o Nombre para buscar cliente —"
					           th:value="${mascota.cliente != null} ? ${mascota.cliente.dni} + ' - ' + ${mascota.cliente.usuario?.nombreCompleto} : ''"
					           autocomplete="off" required>
					    
					    <datalist id="datalistClientes">
					        <option th:each="c : ${todosClientes}" 
					                th:value="${c.dni} + ' - ' + ${c.usuario?.nombreCompleto}"
					                th:attr="data-id=${c.id}">
					        </option>
					    </datalist>
					    
					    <input type="hidden" id="clienteIdHidden" th:field="*{cliente}" />
					</div>

					<div class="fm-acciones">
					    <a sec:authorize="hasRole('admin')" th:href="@{/mascotas}" class="fm-link-volver">
					        <i class="fa-solid fa-arrow-left"></i> Cancelar
					    </a>
					    
					    <a sec:authorize="hasAnyRole('cliente', 'USER')" th:href="@{/mascotas/mis-mascotas}" class="fm-link-volver">
					        <i class="fa-solid fa-arrow-left"></i> Cancelar
					    </a>
					
					    <button type="submit" class="fm-btn">
					        <i class="fa-solid fa-circle-check"></i>
					        <span>Guardar mascota</span>
					    </button>
					</div>
				</form>

			</div>
		</div>

	</main>

	<footer th:replace="~{common/navfooter :: pie}"></footer>

	<script src="/js/admin/formulario-mascota.js"></script>
</body>
</html>
