<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head>
	<meta charset="UTF-8">
	<link rel="icon" type="image/png" sizes="192x192" href="/img/favicons/android-chrome-512x512.png">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Registrar Mascota</title>
	<link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@500;600;700&family=Golos+Text:wght@400;500;600;700&display=swap" rel="stylesheet">
	<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
	<link rel="stylesheet" th:href="@{/css/common/navfooter.css}">
	<link rel="stylesheet" th:href="@{/css/mascotas/formulariomascota.css}">
	<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
</head>

<body>
	<header th:replace="~{common/navfooter :: navbar}"></header>

	<main class="contenido-principal">

		<!-- Fondo slider -->
		<div class="fondo">
			<div class="fondo-imagen activa"><img src="/img/portada/mascotas/mascotaha.jpg" alt=""></div>
			<div class="fondo-imagen"><img src="/img/portada/mascotas/mas7.jpg" alt=""></div>
			<div class="fondo-imagen"><img src="/img/portada/mascotas/mas6.jpg" alt=""></div>
			<div class="fondo-capa"></div>
		</div>

		<!-- Formulario centrado -->
		<div class="centrado">
			<div class="tarjeta">
				<div class="cabecera">
					<div>
						<h1 class="titulo" th:text="${mascota.id != null} ? 'Editar mascota' : 'Nueva mascota'">Nueva mascota</h1>
						<p class="subtitulo" th:text="${mascota.id != null} ? 'Modifica los datos del paciente seleccionado' : 'Completa la información del nuevo paciente'">Completa la información del nuevo paciente</p>
					</div>
				</div>

				<form th:action="@{/mascotas/guardar}" th:object="${mascota}" method="post">
					<input type="hidden" th:field="*{id}" />
					<!-- Nombre | Especie -->
					<div class="fila">
						<div class="campo">
							<label class="etiqueta">Nombre</label>
							<input class="entrada" type="text" th:field="*{nombre}" placeholder="Ej: Toby" required>
						</div>
						<div class="campo">
							<label class="etiqueta">Especie</label>
							<div class="selector-custom">
								<select class="selector" th:field="*{especie}" required>
									<option value="Perro">Perro</option>
									<option value="Gato">Gato</option>
									<option value="Ave">Ave</option>
									<option value="Otro">Otro</option>
								</select>
								<div class="selector-boton">
									<span>Perro</span>
									<i class="fa-solid fa-chevron-down"></i>
								</div>
								<div class="selector-lista"></div>
							</div>
						</div>
					</div>

					<!-- Raza | Fecha de nacimiento -->
					<div class="fila">
						<div class="campo">
							<label class="etiqueta">Raza</label>
							<input class="entrada" type="text" th:field="*{raza}" placeholder="Ej: Labrador">
						</div>
						<div class="campo">
						    <label class="etiqueta">Fecha de nacimiento</label>
						    <input class="entrada" 
						           type="date" 
						           th:id="fechaNacimiento"
						           th:name="fechaNacimiento"
						           th:value="${mascota.fechaNacimiento != null} ? ${#temporals.format(mascota.fechaNacimiento, 'yyyy-MM-dd')} : ''"
						           th:max="${#temporals.format(#temporals.createNow(), 'yyyy-MM-dd')}"
						           required>
						</div>
					</div>

					<!-- Propietario (solo admin) -->
					<div class="campo campo-completo" sec:authorize="hasRole('admin')">
					<label class="etiqueta">Asignar a cliente</label>

						<!-- Select real oculto — lo usa el formulario al enviarse -->
						<select class="selector" th:field="*{cliente}" style="display:none">
							<option value="">— Seleccionar cliente —</option>
							<option th:each="c : ${todosClientes}" th:value="${c.id}"
								th:text="${c.dni} + ' - ' + ${c.usuario.nombreCompleto}">
							</option>
						</select>

						<!-- Buscador visible -->
						<div class="buscador-cliente">
							<input type="text" class="entrada" id="buscadorCliente"
								placeholder="Escribe el nombre o DNI del cliente..."
								autocomplete="off">
							<div class="buscador-lista" id="buscadorLista"></div>
						</div>
					</div>

					<div class="acciones">
					    <a sec:authorize="hasRole('admin')" th:href="@{/mascotas}" class="volver">
					        <i class="fa-solid fa-arrow-left"></i> Cancelar
					    </a>
					    
					    <a sec:authorize="hasAnyRole('cliente', 'USER')" th:href="@{/mascotas/mis-mascotas}" class="volver">
					        <i class="fa-solid fa-arrow-left"></i> Cancelar
					    </a>
					
					    <button type="submit" class="boton">
					        <i class="fa-solid fa-circle-check"></i>
					        <span>Guardar mascota</span>
					    </button>
					</div>
				</form>

			</div>
		</div>

	</main>

	<footer th:replace="~{common/navfooter :: pie}"></footer>

	<script src="/js/admin/formulario-mascota.js"></script>
</body>
</html>
