<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
	<meta charset="UTF-8">
	<link rel="icon" type="image/png" sizes="192x192" href="/img/favicons/android-chrome-512x512.png">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title th:text="${producto.id == null ? 'Añadir Producto' : 'Editar Producto'}">Gestión Tienda</title>
	<link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@500;600;700&family=Golos+Text:wght@400;500;600;700&display=swap" rel="stylesheet">
	<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
	<link rel="stylesheet" th:href="@{/css/common/navfooter.css}">
	<link rel="stylesheet" th:href="@{/css/formulario-producto.css}">
</head>

<body>

	<header th:replace="~{common/navfooter :: navbar}"></header>

	<main class="contenido-principal">

		<!-- Fondo slider -->
		<div class="fondo">
			<div class="fondo-imagen activa"><img src="/img/portada/tienda/tienda3.jpg" alt=""></div>
			<div class="fondo-imagen"><img src="/img/portada/productos/p2.jpg" alt=""></div>
			<div class="fondo-imagen"><img src="/img/portada/tienda/tienda7.jpg" alt=""></div>
			<div class="fondo-capa"></div>
		</div>

		<!-- Formulario centrado -->
		<div class="pagina">
			<div class="tarjeta">

				<div class="cabecera">
					<div>
						<h1 class="titulo" th:text="${producto.id == null ? 'Añadir Producto' : 'Editar Producto'}">Añadir Producto</h1>
						<p class="subtitulo">Completa la información del producto</p>
					</div>
				</div>

				<form th:action="@{/tienda/guardar}" th:object="${producto}" method="post">

					<input type="hidden" th:field="*{id}">

					<!-- Nombre -->
					<div class="campo campo-completo">
						<label class="etiqueta">Nombre del Producto</label>
						<input class="entrada" type="text" th:field="*{nombre}" placeholder="Ej. Pienso Royal Canin" required>
					</div>

					<!-- Categoría (custom select) -->
					<div class="campo campo-completo">
						<label class="etiqueta">Categoría</label>
						<div class="selector-custom">
							<select class="selector" th:field="*{categoria}" required>
								<option value="">— Selecciona categoría —</option>
								<option value="Alimentación">Alimentación</option>
								<option value="Accesorios">Accesorios</option>
								<option value="Higiene">Higiene</option>
								<option value="Salud">Salud</option>
								<option value="Juguetes">Juguetes</option>
							</select>
							<div class="selector-boton">
								<span>— Selecciona categoría —</span>
								<i class="fa-solid fa-chevron-down"></i>
							</div>
							<div class="selector-lista"></div>
						</div>
					</div>

					<!-- Precio | Stock -->
					<div class="fila">
						<div class="campo">
							<label class="etiqueta">Precio (€)</label>
							<input class="entrada" type="number" step="0.01" th:field="*{precio}" placeholder="0.00" required>
						</div>
						<div class="campo">
							<label class="etiqueta">Stock (Unidades)</label>
							<input class="entrada" type="number" th:field="*{stock}" placeholder="0" required min="0">
						</div>
					</div>

					<!-- Descripción -->
					<div class="campo campo-completo">
						<label class="etiqueta">Descripción</label>
						<textarea class="entrada area-texto" th:field="*{descripcion}" placeholder="Detalles del producto..." required></textarea>
					</div>

					<!-- URL Imagen -->
					<div class="campo campo-completo">
						<label class="etiqueta">URL de la Imagen (Opcional)</label>
						<input class="entrada" type="url" th:field="*{imagenUrl}" placeholder="https://...">
					</div>

					<!-- Acciones -->
					<div class="acciones">
						<a th:href="@{/tienda}" class="volver">
							<i class="fa-solid fa-arrow-left"></i> Cancelar
						</a>
						<button type="submit" class="boton">
							<i class="fa-solid fa-circle-check"></i>
							<span th:text="${producto.id == null ? 'Guardar Producto' : 'Actualizar Producto'}">Guardar Producto</span>
						</button>
					</div>

				</form>

			</div>
		</div>

	</main>

	<footer th:replace="~{common/navfooter :: pie}"></footer>

	<script src="/js/admin/formulario-producto.js"></script>

</body>
</html>
