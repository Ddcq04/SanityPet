<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
	<meta charset="UTF-8">
	<link rel="icon" type="image/png" sizes="192x192" href="/img/favicons/android-chrome-512x512.png">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title th:text="${cliente.id == null} ? 'Añadir nuevo cliente' : 'Editar cliente'"></title>
	<link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@500;600;700&family=Golos+Text:wght@400;500;600;700&display=swap" rel="stylesheet">
	<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
	<link rel="stylesheet" th:href="@{/css/common/navfooter.css}">
	<link rel="stylesheet" th:href="@{/css/clientes/formulariocliente.css}">
</head>
<body>

	<header th:replace="~{common/navfooter :: navbar}"></header>

	<main class="pagina">

		<!-- Fondo de imagen -->
		<div class="fondo">
			<div class="fondo-imagen activa"><img src="/img/portada/cliente/cl1.jpg" alt=""></div>
			<div class="fondo-capa"></div>
		</div>

		<!-- Tarjeta centrada -->
		<div class="centrado">
			<div class="tarjeta">

				<div class="cabecera">
					<h1 class="titulo" th:text="${cliente.id == null} ? 'Nuevo cliente' : 'Editar cliente'"></h1>
					<p class="subtitulo" th:text="${cliente.id == null} ? 'Completa los datos del nuevo propietario' : 'Modifica los datos del propietario'"></p>
				</div>

				<form th:action="@{/clientes/guardar}" th:object="${cliente}" method="post">

					<input type="hidden" th:field="*{id}">
					<input type="hidden" th:field="*{usuario.id}">

					<p class="seccion-titulo">Datos personales</p>

					<div class="fila">
						<div class="campo">
							<label class="etiqueta">DNI / Documento</label>
							<input class="entrada" type="text" th:field="*{dni}"
								th:classappend="${#fields.hasErrors('dni')} ? 'invalido' : ''"
								placeholder="Ej: 12345678A" required>
							<small class="error" th:if="${#fields.hasErrors('dni')}" th:errors="*{dni}"></small>
						</div>
						<div class="campo">
							<label class="etiqueta">Teléfono <span class="opcional">Opcional</span></label>
							<input class="entrada" type="text" th:field="*{telefono}" placeholder="Ej: 600 000 000">
						</div>
					</div>

					<div class="campo">
						<label class="etiqueta">Nombre completo</label>
						<input class="entrada" type="text" th:field="*{usuario.nombreCompleto}"
							th:classappend="${#fields.hasErrors('usuario.nombreCompleto')} ? 'invalido' : ''"
							placeholder="Ej: María García López" required>
						<small class="error" th:if="${#fields.hasErrors('usuario.nombreCompleto')}"
							th:errors="*{usuario.nombreCompleto}"></small>
					</div>

					<div class="campo">
						<label class="etiqueta">Email <span class="opcional">Opcional</span></label>
						<input class="entrada" type="email" th:field="*{email}"
							th:classappend="${#fields.hasErrors('email')} ? 'invalido' : ''"
							placeholder="Ej: maria@gmail.com">
						<small class="error" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></small>
					</div>

					<!-- Contraseñas solo al crear -->
					<div th:if="${cliente.id == null}">
						<p class="seccion-titulo" style="margin-top: 1.5rem;">Credenciales</p>

						<div class="fila">
							<div class="campo">
								<label class="etiqueta">Contraseña</label>
								<input class="entrada" type="password" th:field="*{usuario.passwordPlana}"
									th:classappend="${#fields.hasErrors('usuario.passwordPlana')} ? 'invalido' : ''"
									th:required="${cliente.id == null}" placeholder="••••••••">
								<small class="error" th:if="${#fields.hasErrors('usuario.passwordPlana')}"
									th:errors="*{usuario.passwordPlana}"></small>
							</div>
							<div class="campo">
								<label class="etiqueta">Repetir contraseña</label>
								<input class="entrada" type="password" th:field="*{usuario.passwordRepeat}"
									th:classappend="${#fields.hasErrors('usuario.passwordRepeat')} ? 'invalido' : ''"
									th:required="${cliente.id == null}" placeholder="••••••••">
								<small class="error" th:if="${#fields.hasErrors('usuario.passwordRepeat')}"
									th:errors="*{usuario.passwordRepeat}"></small>
							</div>
						</div>
					</div>

					<div class="acciones">
						<a th:href="@{/clientes}" class="volver">
							<i class="fa-solid fa-arrow-left"></i> Cancelar
						</a>
						<button type="submit" class="boton">
							<i class="fa-solid fa-circle-check"></i>
							<span th:text="${cliente.id == null} ? 'Guardar cliente' : 'Actualizar cliente'"></span>
						</button>
					</div>

				</form>

			</div>
		</div>

	</main>

	<footer th:replace="~{common/navfooter :: pie}"></footer>
	<script src="/js/admin/formulario-cliente.js"></script>
</body>
</html>
