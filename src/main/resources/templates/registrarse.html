<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
	<meta charset="UTF-8">
	<link rel="icon" type="image/png" sizes="192x192" href="/img/favicons/android-chrome-512x512.png">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Registrarse</title>
	<link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@500;600;700&family=Golos+Text:wght@400;500;600;700&display=swap" rel="stylesheet">
	<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
	<link rel="stylesheet" th:href="@{/css/registrarse.css}">
</head>

<body>

	<!-- Tarjeta del formulario -->
	<div class="tarjeta">

		<!-- Cabecera con logo y título -->
		<div class="cabecera">
			<img src="/img/logo/SANYTYPETlogo.png" alt="SanityPet" class="logo">
			<div class="cabecera-texto">
				<h2 class="titulo">Crear cuenta</h2>
				<p class="descripcion">Regístrate para acceder a todos nuestros servicios</p>
			</div>
		</div>

		<!-- Cuerpo con el formulario -->
		<div class="cuerpo">

			<!-- Mensaje de error -->
			<div th:if="${error}" class="alerta-error">
				<i class="fa-solid fa-circle-xmark"></i>
				<span th:text="${error}"></span>
			</div>

			<form th:action="@{/registrar-socio}" th:object="${cliente}" method="post">
				<input type="hidden" th:field="*{id}">
				<input type="hidden" th:field="*{usuario.id}">

				<!-- DNI y Nombre -->
				<div class="fila">
					<div class="campo">
						<label class="etiqueta" for="dni">DNI</label>
						<input class="entrada" type="text" id="dni" th:field="*{dni}"
							placeholder="12345678X" required
							th:classappend="${#fields.hasErrors('dni')} ? ' invalido' : ''">
						<small class="error-campo" th:if="${#fields.hasErrors('dni')}" th:errors="*{dni}"></small>
					</div>
					<div class="campo">
						<label class="etiqueta" for="nombreCompleto">Nombre completo</label>
						<input class="entrada" type="text" id="nombreCompleto"
							th:field="*{usuario.nombreCompleto}" placeholder="Juan Pérez" required
							th:classappend="${#fields.hasErrors('usuario.nombreCompleto')} ? ' invalido' : ''">
						<small class="error-campo" th:if="${#fields.hasErrors('usuario.nombreCompleto')}" th:errors="*{usuario.nombreCompleto}"></small>
					</div>
				</div>

				<!-- Teléfono y Email -->
				<div class="fila">
					<div class="campo">
						<label class="etiqueta" for="telefono">Teléfono</label>
						<input class="entrada" type="tel" id="telefono" th:field="*{telefono}"
							placeholder="600 000 000"
							th:classappend="${#fields.hasErrors('telefono')} ? ' invalido' : ''">
						<small class="error-campo" th:if="${#fields.hasErrors('telefono')}" th:errors="*{telefono}"></small>
					</div>
					<div class="campo">
						<label class="etiqueta" for="email">Email</label>
						<input class="entrada" type="email" id="email" th:field="*{email}"
							placeholder="correo@ejemplo.com"
							th:classappend="${#fields.hasErrors('email')} ? ' invalido' : ''">
						<small class="error-campo" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></small>
					</div>
				</div>

				<!-- Contraseñas -->
				<div class="fila">
					<div class="campo">
						<label class="etiqueta" for="password">Contraseña</label>
						<input class="entrada" type="password" id="password"
							th:field="*{usuario.passwordPlana}" placeholder="Mínimo 6 caracteres" required
							th:classappend="${#fields.hasErrors('usuario.passwordPlana')} ? ' invalido' : ''">
						<small class="error-campo" th:if="${#fields.hasErrors('usuario.passwordPlana')}" th:errors="*{usuario.passwordPlana}"></small>
					</div>
					<div class="campo">
						<label class="etiqueta" for="passwordRepeat">Repetir contraseña</label>
						<input class="entrada" type="password" id="passwordRepeat"
							th:field="*{usuario.passwordRepeat}" placeholder="Repite la contraseña" required
							th:classappend="${#fields.hasErrors('usuario.passwordRepeat')} ? ' invalido' : ''">
						<small class="error-campo" th:if="${#fields.hasErrors('usuario.passwordRepeat')}" th:errors="*{usuario.passwordRepeat}"></small>
					</div>
				</div>

				<button type="submit" class="boton">
					<i class="fa-solid fa-user-plus"></i>
					<span>Crear mi cuenta</span>
				</button>

			</form>

			<!-- Enlace a login -->
			<p class="enlace-acceso">
				¿Ya tienes cuenta? <a th:href="@{/login}">Inicia sesión aquí</a>
			</p>

		</div>
	</div>

</body>
</html>
