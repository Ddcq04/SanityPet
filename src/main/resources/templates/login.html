<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
	<meta charset="UTF-8">
	<link rel="icon" type="image/png" sizes="192x192" href="/img/favicons/android-chrome-512x512.png">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Inicio de sesión</title>
	<link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;600;700&display=swap" rel="stylesheet">
	<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
	<link rel="stylesheet" th:href="@{/css/login.css}">
</head>

<body>

	<!-- Contenedor principal -->
	<div class="contenedor">

		<!-- Panel izquierdo verde -->
		<div class="panel-izq">
			<div class="cabecera">
				<img th:src="@{/img/logo/SANYTYPETlogo.png}" alt="SanityPet" class="logo">
				<h2>Bienvenido de nuevo</h2>
				<p>Comprometidos con el cuidado y bienestar de tu mascota</p>
			</div>
		</div>

		<!-- Panel derecho con el formulario -->
		<div class="panel-der">
			<form th:action="@{/login}" method="post">
				<h3>Iniciar Sesión</h3>
				<p>Ingresa tus credenciales</p>

				<!-- Mensaje de registro exitoso -->
				<div th:if="${param.registrado}" class="mensaje-exito">
					¡Registro completado! Ya puedes iniciar sesión con tu DNI.
				</div>

				<!-- Mensaje de error -->
				<div th:if="${param.error}" class="mensaje-error">
					Usuario o contraseña incorrectos.
				</div>

				<!-- Mensaje de cierre de sesión -->
				<div th:if="${param.logout}" class="mensaje-exito">
					Has cerrado sesión correctamente.
				</div>

				<!-- Campo usuario -->
				<div class="campo">
					<label>Usuario</label>
					<input type="text" name="username" placeholder="DNI" required autofocus>
				</div>

				<!-- Campo contraseña -->
				<div class="campo">
					<label>Contraseña</label>
					<input type="password" name="password" placeholder="Contraseña" required>
				</div>

				<!-- Recuérdame -->
				<div class="pie-form">
					<label style="display:flex; align-items:center; gap:0.4rem; cursor:pointer;">
						<input type="checkbox" name="remember-me"> Recuérdame
					</label>
				</div>

				<button type="submit" class="boton">Acceder</button>
			</form>

			<!-- Enlace a registro -->
			<div class="crear-cuenta">
				¿Nuevo en la clínica? <a th:href="@{/registrarse}">Crea una cuenta de socio</a>
			</div>
		</div>

	</div>

</body>

</html>
