<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head>
	<meta charset="UTF-8">
	<link rel="icon" type="image/png" sizes="192x192" href="/img/favicons/android-chrome-512x512.png">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Agenda</title>
	<link
		href="https://fonts.googleapis.com/css2?family=Quicksand:wght@500;600;700&family=Golos+Text:wght@400;500;600;700&display=swap"
		rel="stylesheet">
	<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
	<link rel="stylesheet" th:href="@{/css/common/navfooter.css}">
	<link rel="stylesheet" th:href="@{/css/citas/agenda.css}">
</head>

<body>

	<header th:replace="~{common/navfooter :: navbar}">
		<!-- navbar -->
	</header>

	<div class="citas-banner">
		<img src="/img/portada/mascotas/mas3.jpg" alt="">
		<div class="citas-banner-overlay"></div>
		<div class="citas-banner-contenido">
			<h1 class="citas-banner-titulo">Gestión de Citas</h1>
			<p class="citas-banner-subtitulo">Panel de administración de la agenda de la clínica</p>
		</div>
	</div>

	<main class="citas-main">

		<div class="citas-cabecera">
			<a th:href="@{/citas/reservar}" href="#" class="btn-nueva-cita">
				<i class="fa-solid fa-plus"></i> Nueva Cita
			</a>
			<div class="cabecera-contador">
				<span class="contador-numero" th:text="${#lists.size(citas)}">0</span>
				<span class="contador-label" th:text="${filtroActivo == 'hoy'} ? 'Citas de hoy' : (${filtroActivo == 'semana'} ? 'Citas esta semana' : 'Citas en agenda')">Citas en agenda</span>
			</div>
		</div>

		<div class="agenda-filtros-container">
			<div class="filtros-grupo">
				<a th:href="@{/citas}"
				   class="btn-filtro-item" th:classappend="${filtroActivo == null} ? ' activo' : ''">
					Todo
				</a>
				<a th:href="@{/citas(filtro='hoy')}"
				   class="btn-filtro-item" th:classappend="${filtroActivo == 'hoy'} ? ' activo' : ''">
					Hoy
				</a>
				<a th:href="@{/citas(filtro='semana')}"
				   class="btn-filtro-item" th:classappend="${filtroActivo == 'semana'} ? ' activo' : ''">
					Esta Semana
				</a>
			</div>
		</div>

		<div class="citas-tarjeta">

				<div class="tabla-contenedor">
					<table class="tabla-citas">
						<thead>
							<tr>
								<th>Fecha y Hora</th>
								<th>Mascota</th>
								<th>Propietario</th>
								<th>Motivo</th>
								<th>Descripción</th>
								<th>Acciones</th>
							</tr>
						</thead>
						<tbody>
							<tr th:each="c : ${citas}">

								<td data-label="Fecha y Hora" th:text="${#temporals.format(c.fechaHora, 'dd/MM/yyyy HH:mm')}"></td>

								<td data-label="Mascota"><span class="badge-mascota" th:text="${c.mascota?.nombre}"></span></td>

								<td data-label="Propietario" class="col-propietario" th:text="${c.mascota?.cliente?.usuario?.nombreCompleto}">
								</td>

								<td data-label="Motivo" th:text="${c.motivo}"></td>
								<td data-label="Descripción" th:text="${c.descripcion}"></td>
								<td data-label="Acciones" class="col-acciones">
									<a th:href="@{/citas/editar/{id}(id=${c.id})}" class="btn-editar" title="Editar">
								        <i class="fa-solid fa-pen"></i>
								    </a>
									<a class="btn-eliminar" th:href="@{/citas/cancelar/{id}(id=${c.id})}"
										onclick="return confirm('¿Estás seguro de que deseas eliminar esta cita de forma permanente?')" title="Eliminar">
										<i class="fa-solid fa-trash"></i>
									</a>
								</td>
							</tr>
						</tbody>
					</table>
				</div>


		</div>

	</main>
	<!-- FOOTER -->
	<footer th:replace="~{common/navfooter :: pie}"></footer>

</body>
</html>
