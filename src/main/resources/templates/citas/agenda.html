<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head>
	<meta charset="UTF-8">
	<link rel="icon" type="image/png" sizes="192x192" href="/favicons/android-chrome-512x512.png">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Agenda</title>
	<link
		href="https://fonts.googleapis.com/css2?family=Quicksand:wght@500;600;700&family=Golos+Text:wght@400;500;600;700&display=swap"
		rel="stylesheet">
	<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
	<link rel="stylesheet" th:href="@{/css/common/navfooter.css}">
	<link rel="stylesheet" th:href="@{/css/citas/agenda.css}">
</head>

<body>

	<header th:replace="~{common/navfooter :: navbar}">
		<!-- navbar -->
	</header>

	<div class="citas-banner">
		<div class="citas-banner-overlay"></div>
		<div class="citas-banner-contenido">
			<h1 class="citas-banner-titulo">Gestión de Citas</h1>
			<p class="citas-banner-subtitulo">Panel de administración de la agenda de la clínica</p>
		</div>
	</div>

	<main class="citas-main">

		<div class="citas-cabecera">
			<a th:href="@{/citas/reservar}" href="#" class="btn-nueva-cita">
				<i class="fa-solid fa-plus"></i> Nueva Cita
			</a>
			<div class="cabecera-contador">
				<span class="contador-numero" th:text="${#lists.size(citas)}">0</span>
				<span class="contador-label" th:text="${filtroActivo == 'hoy'} ? 'Citas de hoy' : (${filtroActivo == 'semana'} ? 'Citas esta semana' : 'Citas en agenda')">Citas en agenda</span>
			</div>
		</div>

		<div class="citas-tarjeta">

			<div class="agenda-filtros-container" style="display: flex; justify-content: space-between; align-items: center; gap: 15px; flex-wrap: wrap;">
				
				<div class="filtros-grupo">
					<a th:href="@{/citas}"
					   class="btn-filtro-item" th:classappend="${filtroActivo == null && mascotaSeleccionada == null} ? ' activo' : ''">
						Todo
					</a>
					<a th:href="@{/citas(filtro='hoy')}"
					   class="btn-filtro-item" th:classappend="${filtroActivo == 'hoy'} ? ' activo' : ''">
						Hoy
					</a>
					<a th:href="@{/citas(filtro='semana')}"
					   class="btn-filtro-item" th:classappend="${filtroActivo == 'semana'} ? ' activo' : ''">
						Esta Semana
					</a>
				</div>

				<form th:action="@{/citas}" method="get" class="formulario-filtros" style="display: flex; align-items: center; gap: 10px; margin: 0;">
					<div class="input-busqueda" style="display: flex; align-items: center; background: #1e1e1e; padding: 4px 10px; border-radius: 6px; border: 1px solid #333;">
						<i class="fa-solid fa-magnifying-glass" style="color: #888; margin-right: 8px;"></i>
						<select name="mascotaId" onchange="this.form.submit()" 
								style="background: transparent; color: #fff; border: none; outline: none; font-family: 'Golos Text', sans-serif; cursor: pointer; padding-right: 20px;">
							<option value="" style="background: #1e1e1e; color: #fff;">Filtrar por paciente...</option>
							<option th:each="m : ${todasLasMascotas}" 
									th:value="${m.id}" 
									th:text="${m.nombre} + ' (' + (${m.cliente?.usuario?.nombreCompleto} ?: 'Sin dueño') + ')'"
									th:selected="${m.id == mascotaSeleccionada}"
									style="background: #1e1e1e; color: #fff;">Toby</option>
						</select>
					</div>
					<a th:if="${mascotaSeleccionada != null}" th:href="@{/citas}" class="btn-filtro-item" style="background: #902e39; border-color: #902e39; color: #fff;">
						<i class="fa-solid fa-xmark"></i>
					</a>
				</form>
			</div>

			<div th:if="${tituloFiltro != null}" class="filtro-info-alerta" style="margin: 15px 20px 0 20px; padding: 8px 15px; background: rgba(0, 180, 216, 0.1); border-left: 4px solid #00b4d8; border-radius: 4px; font-family: 'Quicksand', sans-serif; font-size: 14px; color: #00b4d8;">
				<i class="fa-solid fa-info-circle"></i> Vista actual: <span th:text="${tituloFiltro}" style="font-weight: 600;">Agenda Completa</span>
			</div>

				<div class="tabla-contenedor">
					<table class="tabla-citas">
						<thead>
							<tr>
								<th>Fecha y Hora</th>
								<th>Mascota</th>
								<th>Propietario</th>
								<th>Motivo</th>
								<th>Descripción</th>
								<th>Acciones</th>
							</tr>
						</thead>
						<tbody>
							<tr th:each="c : ${citas}">

								<td th:text="${#temporals.format(c.fechaHora, 'dd/MM/yyyy HH:mm')}"></td>

								<td><span class="badge-mascota" th:text="${c.mascota?.nombre}"></span></td>

								<td class="col-propietario" th:text="${c.mascota?.cliente?.usuario?.nombreCompleto}">
								</td>

								<td th:text="${c.motivo}"></td>
								<td th:text="${c.descripcion}"></td>
								<td class="col-acciones">
									<a th:href="@{/citas/editar/{id}(id=${c.id})}" class="btn-editar" title="Editar">
								        <i class="fa-solid fa-pen"></i>
								    </a>
									<a class="btn-eliminar" th:href="@{/citas/cancelar/{id}(id=${c.id})}"
										onclick="return confirm('¿Estás seguro de que deseas eliminar esta cita de forma permanente?')" title="Eliminar">
										<i class="fa-solid fa-trash"></i>
									</a>
								</td>
							</tr>
						</tbody>
					</table>
				</div>

				<div class="tabla-pie">
					Mostrando <span th:text="${#lists.size(citas)}">0</span> citas programadas.
				</div>

		</div>

	</main>
	<!-- FOOTER -->
	<footer th:replace="~{common/navfooter :: pie}"></footer>

</body>
</html>
