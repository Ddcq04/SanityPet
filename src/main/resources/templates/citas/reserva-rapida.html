<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
	  xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
	<meta charset="UTF-8">
	<link rel="icon" type="image/png" sizes="192x192" href="/img/favicons/android-chrome-512x512.png">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Nueva Cita</title>
	<link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@500;600;700&family=Golos+Text:wght@400;500;600;700&display=swap" rel="stylesheet">
	<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
	<link rel="stylesheet" th:href="@{/css/common/navfooter.css}">
	<link rel="stylesheet" th:href="@{/css/citas/reserva-rapida.css}">
</head>

<body>
	<header th:replace="~{common/navfooter :: navbar}"></header>

	<main class="contenido-principal">

		<div class="rc-fondo">
			<div class="rc-slide activa"><img src="/img/portada/citas/perritogolde.jpg" alt=""></div>
			<div class="rc-slide"><img src="/img/portada/citas/citaaa.jpg" alt=""></div>
			<div class="rc-slide"><img src="/img/portada/citas/doctorexa.jpg" alt=""></div>
			<div class="rc-overlay"></div>
		</div>

		<div class="rc-pagina">
			<div class="rc-card">

				<div class="rc-card-header">
					<div>
						<h1 class="rc-titulo" th:text="${esEdicion} ? 'Modificar cita' : 'Nueva cita'">Nueva cita</h1>
						<p class="rc-sub">Rellena el formulario para reservar</p>
					</div>
				</div>

				<form id="citaForm" th:action="@{/citas/reservar/guardar}" th:object="${cita}" method="post">
					<input type="hidden" th:field="*{id}" />

					<div class="rc-fila-dos">
						<div class="rc-campo">
							<label class="rc-label">Mascota</label>

							<!-- Select real oculto — lo usa el formulario al enviarse -->
							<select class="rc-select" th:field="*{mascota}" style="display:none" required>
								<option value="">— Selecciona —</option>
								<option th:each="m : ${listaMascotas}" th:value="${m.id}"
									th:text="${m.nombre} + ' (' + ${m.cliente?.usuario?.nombreCompleto} + ')'">
								</option>
							</select>

							<!-- Buscador visible -->
							<div class="rc-buscador-mascota">
								<input type="text" class="rc-input" id="buscadorMascota"
									placeholder="Escribe el nombre de la mascota..."
									autocomplete="off">
								<div class="rc-buscador-lista" id="buscadorListaMascota"></div>
							</div>

							<small class="rc-error" th:if="${#fields.hasErrors('mascota')}" th:errors="*{mascota}"></small>
						</div>

						<div class="rc-campo">
							<label class="rc-label">Servicio</label>
							<div class="rc-custom-select">
								<select class="rc-select" th:field="*{motivo}"
									th:classappend="${#fields.hasErrors('motivo')} ? 'is-invalid' : ''" required>
									<option value="">— Selecciona —</option>
									<option value="Consulta General - 30€">Consulta General (30€)</option>
									<option value="Vacunación - 45€">Vacunación (45€)</option>
									<option value="Diagnóstico (Eco/Rx) - 60€">Diagnóstico Eco/Rx (60€)</option>
									<option value="Peluquería - 25€">Peluquería (25€)</option>
									<option value="Cirugía - Desde 120€">Cirugía (Consultar)</option>
								</select>
								<div class="rc-select-trigger"><span>— Selecciona —</span><i class="fa-solid fa-chevron-down"></i></div>
								<div class="rc-select-lista"></div>
							</div>
							<small class="rc-error" th:if="${#fields.hasErrors('motivo')}" th:errors="*{motivo}"></small>
						</div>
					</div>
					
					<div class="rc-fila-dos">
					    <div class="rc-campo">
					        <label class="rc-label">Día</label>
					        <input class="rc-input" type="date" id="fechaInput"
					            th:value="${cita.fechaHora != null} ? ${#temporals.format(cita.fechaHora, 'yyyy-MM-dd')} : ''"
					            th:classappend="${#fields.hasErrors('fechaHora')} ? 'is-invalid' : ''"
					            th:min="${#temporals.format(#temporals.createNow(), 'yyyy-MM-dd')}"
					            th:disabled="${esEdicion and cita.fechaHora != null and cita.fechaHora.isBefore(#temporals.createNow())}" required>
					        <small class="rc-error" th:if="${#fields.hasErrors('fechaHora')}" th:errors="*{fechaHora}"></small>
					    </div>
					
					    <div class="rc-campo">
					        <label class="rc-label">Hora</label>
					        <div class="rc-custom-select" id="horaWrapper">
					            <select class="rc-select" id="horaSelect" th:field="*{fechaHora}"
					                th:disabled="${esEdicion and cita.fechaHora != null and cita.fechaHora.isBefore(#temporals.createNow())}" required>
					                <option th:if="${!esEdicion}" value="">— Elige día primero —</option>
					                <option th:if="${esEdicion}"
					                        th:value="${#temporals.format(cita.fechaHora, 'yyyy-MM-dd''T''HH:mm:ss')}"
					                        th:text="${#temporals.format(cita.fechaHora, 'HH:mm')}"
					                        selected>
					                </option>
					            </select>
					            <div class="rc-select-trigger"><span>— Elige día primero —</span><i class="fa-solid fa-chevron-down"></i></div>
					            <div class="rc-select-lista"></div>
					        </div>
					    </div>
					</div>

					<div class="rc-campo" sec:authorize="hasRole('admin')" style="margin-top: 15px; margin-bottom: 20px;">
						<label class="rc-label">Descripción / Notas Clínicas</label>
						<textarea class="rc-input" th:field="*{descripcion}" rows="4"
								  placeholder="Escribe aquí las observaciones clínicas o detalles de la cita..."
								  style="resize: vertical; font-family: inherit; padding: 10px; height: auto;"></textarea>
						<small class="rc-error" th:if="${#fields.hasErrors('descripcion')}" th:errors="*{descripcion}"></small>
					</div>

					<div class="rc-acciones">
						<a th:href="@{/citas}" class="rc-link-volver">
					        <i class="fa-solid fa-arrow-left"></i> Volver
					    </a>
						<button type="submit" class="rc-btn">
							<i class="fa-solid fa-circle-check"></i>
							<span th:text="${esEdicion} ? 'Guardar cambios' : 'Confirmar reserva'">Confirmar reserva</span>
						</button>
					</div>

				</form>

			</div>
		</div>

	</main>

	<footer th:replace="~{common/navfooter :: pie}"></footer>

	<script src="/js/user/reserva-rapida.js"></script>
</body>
</html>
