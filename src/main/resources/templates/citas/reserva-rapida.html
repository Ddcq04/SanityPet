<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
	<meta charset="UTF-8">
	<link rel="icon" type="image/png" sizes="192x192" href="/favicons/android-chrome-512x512.png">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Reservar Cita</title>
	<link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@500;600;700&family=Golos+Text:wght@400;500;600;700&display=swap" rel="stylesheet">
	<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
	<link rel="stylesheet" th:href="@{/css/common/navfooter.css}">
	<link rel="stylesheet" th:href="@{/css/citas/reserva-rapida.css}">
</head>

<body>
	<header th:replace="~{common/navfooter :: navbar}"></header>

	<main class="contenido-principal">

		<!-- Fondo slider -->
		<div class="rc-fondo">
			<div class="rc-slide activa"><img src="/portada/citas/perritogolde.jpg" alt=""></div>
			<div class="rc-slide"><img src="/portada/citas/citaaa.jpg" alt=""></div>
			<div class="rc-slide"><img src="/portada/citas/doctorexa.jpg" alt=""></div>
			<div class="rc-overlay"></div>
		</div>

		<!-- Formulario centrado -->
		<div class="rc-pagina">
			<div class="rc-card">

				<div class="rc-card-header">
					<div>
						<h1 class="rc-titulo" th:text="${esEdicion} ? 'Modificar cita' : 'Nueva cita'">Nueva cita</h1>
						<p class="rc-sub">Rellena el formulario para reservar</p>
					</div>
				</div>

				<form id="citaForm" th:action="@{/citas/reservar/guardar}" th:object="${cita}" method="post">
					<input type="hidden" th:field="*{id}" />

					<div class="rc-fila-dos">
						<div class="rc-campo">
							<label class="rc-label"><i class="fa-solid fa-paw"></i> Mascota</label>
							<select class="rc-select" th:field="*{mascota}"
								th:classappend="${#fields.hasErrors('mascota')} ? 'is-invalid' : ''" required>
								<option value="">— Selecciona —</option>
								<option th:each="m : ${listaMascotas}" th:value="${m.id}"
									th:text="${m.nombre} + ' (' + ${m.cliente?.usuario?.nombreCompleto} + ')'">
								</option>
							</select>
							<small class="rc-error" th:if="${#fields.hasErrors('mascota')}" th:errors="*{mascota}"></small>
						</div>

						<div class="rc-campo">
							<label class="rc-label"><i class="fa-solid fa-stethoscope"></i> Servicio</label>
							<select class="rc-select" th:field="*{motivo}"
								th:classappend="${#fields.hasErrors('motivo')} ? 'is-invalid' : ''" required>
								<option value="">— Selecciona —</option>
								<option value="Consulta General - 30€">Consulta General (30€)</option>
								<option value="Vacunación - 45€">Vacunación (45€)</option>
								<option value="Diagnóstico (Eco/Rx) - 60€">Diagnóstico Eco/Rx (60€)</option>
								<option value="Peluquería - 25€">Peluquería (25€)</option>
								<option value="Cirugía - Desde 120€">Cirugía (Consultar)</option>
							</select>
							<small class="rc-error" th:if="${#fields.hasErrors('motivo')}" th:errors="*{motivo}"></small>
						</div>
					</div>

					<div class="rc-fila-dos">
						<div class="rc-campo">
							<label class="rc-label"><i class="fa-regular fa-calendar"></i> Día</label>
							<input class="rc-input" type="date" id="fechaInput"
								th:classappend="${#fields.hasErrors('fechaHora')} ? 'is-invalid' : ''"
								th:min="${#temporals.format(#temporals.createNow(), 'yyyy-MM-dd')}" required>
							<small class="rc-error" th:if="${#fields.hasErrors('fechaHora')}" th:errors="*{fechaHora}"></small>
						</div>

						<div class="rc-campo">
							<label class="rc-label"><i class="fa-regular fa-clock"></i> Hora</label>
							<select class="rc-select" id="horaSelect" th:field="*{fechaHora}" required>
								<option value="">— Elige día primero —</option>
							</select>
						</div>
					</div>

					<div class="rc-acciones">
						<a th:href="@{/home}" href="#" class="rc-link-volver">
							<i class="fa-solid fa-arrow-left"></i> Volver
						</a>
						<button type="submit" class="rc-btn">
							<i class="fa-solid fa-circle-check"></i>
							<span th:text="${esEdicion} ? 'Guardar cambios' : 'Confirmar reserva'">Confirmar reserva</span>
						</button>
					</div>

				</form>

			</div>
		</div>

	</main>

	<footer th:replace="~{common/navfooter :: pie}"></footer>

	<script>
		// Slider
		(function () {
			const slides = document.querySelectorAll('.rc-slide');
			let actual = 0;
			setInterval(function () {
				slides[actual].classList.remove('activa');
				actual = (actual + 1) % slides.length;
				slides[actual].classList.add('activa');
			}, 8000);
		})();

		// Horas disponibles
		document.getElementById('fechaInput').addEventListener('change', function () {
			const fecha = this.value;
			const select = document.getElementById('horaSelect');
			select.innerHTML = '<option value="">Cargando...</option>';
			fetch('/citas/horas-disponibles?fecha=' + fecha)
				.then(res => res.json())
				.then(horas => {
					select.innerHTML = '<option value="">— Selecciona hora —</option>';
					horas.forEach(h => select.add(new Option(h, fecha + 'T' + h + ':00')));
				});
		});

		// Envío
		document.getElementById('citaForm').addEventListener('submit', function (e) {
			e.preventDefault();
			fetch(this.action, { method: 'POST', body: new FormData(this) })
				.then(async res => {
					const data = await res.json();
					if (res.ok) { alert(data.mensaje); window.location.href = '/citas'; }
					else { alert('⚠️ Error: ' + data.error); }
				})
				.catch(() => alert('❌ Error de conexión'));
		});
	</script>
</body>
</html>
