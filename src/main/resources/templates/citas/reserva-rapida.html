<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
	<meta charset="UTF-8">
	<link rel="icon" type="image/png" sizes="192x192" href="/favicons/android-chrome-512x512.png">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Reservar Cita</title>
	<link
		href="https://fonts.googleapis.com/css2?family=Quicksand:wght@500;600;700&family=Golos+Text:wght@400;500;600;700&display=swap"
		rel="stylesheet">
	<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
	<link rel="stylesheet" th:href="@{/css/common/navfooter.css}">
	<link rel="stylesheet" th:href="@{/css/citas/reserva-rapida.css}">
</head>

<body>

	<header th:replace="~{common/navfooter :: navbar}">
	</header>

	<main class="contenido-principal">

		<div class="pagina-split">

			<!-- Panel visual izquierdo -->
			<div class="split-visual">
				<div class="split-slide activa"><img src="/portada/citas/perritogolde.jpg" alt=""></div>
				<div class="split-slide"><img src="/portada/citas/citaaa.jpg" alt=""></div>
				<div class="split-slide"><img src="/portada/citas/doctorexa.jpg" alt=""></div>
				<div class="split-overlay"></div>
				<div class="split-contenido">
					<span class="portada-badge"><i class="fa-solid fa-calendar-check"></i> SanityPet</span>
					<h1 class="split-titulo" th:utext="${esEdicion} ? 'Modifica tu<br>cita' : 'Reserva tu<br>cita'">Reserva tu<br>cita</h1>
					<p class="split-desc">Nuestros veterinarios están listos para cuidar a tu mascota.</p>
				</div>
			</div>

			<!-- Panel formulario derecho -->
			<div class="split-form">

				<div class="cabecera-pagina">
					<h2 class="titulo-pagina" th:text="${esEdicion} ? 'Modificar Cita' : 'Nueva Cita'">Nueva Cita</h2>
					<p class="subtitulo-pagina">Rellena el formulario para reservar con nuestros veterinarios</p>
				</div>

				<div class="tarjeta-formulario">
					<form id="citaForm" th:action="@{/citas/reservar/guardar}" th:object="${cita}" method="post">
						<input type="hidden" th:field="*{id}" />

						<!-- Mascota -->
						<div class="campo-grupo">
							<label class="campo-etiqueta" for="mascota">Mascota</label>
							<select class="campo-select" id="mascota" th:field="*{mascota}"
								th:classappend="${#fields.hasErrors('mascota')} ? 'is-invalid' : ''" required>
								<option value="">-- Selecciona una mascota --</option>
								<option th:each="m : ${listaMascotas}" th:value="${m.id}"
									th:text="${m.nombre} + ' (' + ${m.cliente?.usuario?.nombreCompleto} + ')'">
								</option>
							</select>
							<small class="texto-error" th:if="${#fields.hasErrors('mascota')}" th:errors="*{mascota}"></small>
						</div>

						<!-- Día -->
						<div class="campo-grupo">
							<label class="campo-etiqueta" for="fechaInput">Día</label>
							<input class="campo-input" type="date" id="fechaInput"
								th:classappend="${#fields.hasErrors('fechaHora')} ? 'is-invalid' : ''"
								th:min="${#temporals.format(#temporals.createNow(), 'yyyy-MM-dd')}" required>
							<small class="texto-error" th:if="${#fields.hasErrors('fechaHora')}"
								th:errors="*{fechaHora}"></small>
						</div>

						<!-- Hora -->
						<div class="campo-grupo">
							<label class="campo-etiqueta" for="horaSelect">Hora</label>
							<select class="campo-select" id="horaSelect" th:field="*{fechaHora}" required>
								<option value="">-- Selecciona un día primero --</option>
							</select>
						</div>

						<!-- Motivo -->
						<div class="campo-grupo">
							<label class="campo-etiqueta" for="motivo">Servicio / Motivo</label>
							<select class="campo-select" id="motivo" th:field="*{motivo}" required>
								<option value="">-- Selecciona un servicio --</option>
								<option value="Consulta General - 30€">Consulta General (30€)</option>
								<option value="Vacunación - 45€">Vacunación (45€)</option>
								<option value="Diagnóstico (Eco/Rx) - 60€">Diagnóstico Eco/Rx (60€)</option>
								<option value="Peluquería - 25€">Peluquería (25€)</option>
								<option value="Cirugía - Desde 120€">Cirugía (Consultar presupuesto)</option>
							</select>
							<small class="texto-error" th:if="${#fields.hasErrors('motivo')}" th:errors="*{motivo}"></small>
						</div>

						<button type="submit" class="boton-confirmar">Confirmar Reserva</button>

					</form>

					<a th:href="@{/home}" href="#" class="enlace-volver">Volver al inicio</a>
				</div>

			</div><!-- fin split-form -->

		</div><!-- fin pagina-split -->

	</main>

	<!-- FOOTER -->
	<footer th:replace="~{common/navfooter :: pie}"></footer>

	<script th:inline="javascript">
		document.getElementById('fechaInput').addEventListener('change', function () {
			const fecha = this.value;
			const select = document.getElementById('horaSelect');
			select.innerHTML = '<option value="">Cargando...</option>';

			fetch('/citas/horas-disponibles?fecha=' + fecha)
				.then(res => res.json())
				.then(horas => {
					select.innerHTML = '<option value="">-- Selecciona hora --</option>';
					horas.forEach(h => {
						const option = new Option(h, fecha + 'T' + h + ':00');
						select.add(option);
					});
				});
		});
		document.getElementById('citaForm').addEventListener('submit', function (e) {
			e.preventDefault();

			const formData = new FormData(this);

			fetch(this.action, {
				method: 'POST',
				body: formData,
			})
				.then(async response => {
					const data = await response.json();
					if (response.ok) {
						alert(data.mensaje);
						window.location.href = '/citas';
					} else {
						alert("⚠️ Error: " + data.error);
					}
				})
				.catch(err => {
					alert("❌ Error de conexión con el servidor");
				});
		});

		// Slider
		(function () {
			const slides = document.querySelectorAll('.split-slide');
			let actual = 0;
			setInterval(function () {
				slides[actual].classList.remove('activa');
				actual = (actual + 1) % slides.length;
				slides[actual].classList.add('activa');
			}, 8000);
		})();
	</script>
</body>
</html>
