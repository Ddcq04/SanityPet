<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head>
	<meta charset="UTF-8">
	<link rel="icon" type="image/png" sizes="192x192" href="/favicons/android-chrome-512x512.png">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Mis Compras</title>
	<!-- Fuentes -->
	<link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;500;600;700&family=Golos+Text:wght@400;500;600;700&display=swap" rel="stylesheet">
	<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
	<!-- Estilos compartidos -->
	<link rel="stylesheet" th:href="@{/css/common/navfooter.css}">
	<link rel="stylesheet" th:href="@{/css/tienda.css}">
	<style>
		body {
			background-image: linear-gradient(to bottom, rgba(10,20,20,0.62) 0%, rgba(10,20,20,0.62) 12%, rgba(32,150,139,0.18) 35%), url('/portada/productos/p3.jpg');
			background-size: cover;
			background-position: center center;
			background-attachment: fixed;
		}

		.historial-card {
			background: rgba(255, 255, 255, 0.05);
			backdrop-filter: blur(8px);
			-webkit-backdrop-filter: blur(8px);
			border: 1px solid rgba(255, 255, 255, 0.14);
			border-radius: 20px;
			padding: 2rem;
			margin-top: 2rem;
			box-shadow: 0 16px 48px rgba(0, 0, 0, 0.35);
		}

		.historial-table {
			width: 100%;
			border-collapse: collapse;
			margin-bottom: 2rem;
		}

		.historial-table th {
			text-align: left;
			padding: 1rem;
			border-bottom: 2px solid rgba(255, 255, 255, 0.15);
			color: rgba(255, 255, 255, 0.6);
			text-transform: uppercase;
			font-size: 0.8rem;
			letter-spacing: 0.05em;
		}

		.historial-table td {
			padding: 1.5rem 1rem;
			border-bottom: 1px solid rgba(255, 255, 255, 0.10);
			color: #ffffff;
		}

		.item-info {
			display: flex;
			align-items: center;
			gap: 1rem;
		}

		.item-img {
			width: 50px;
			height: 50px;
			border-radius: 8px;
			background: var(--menta-claro);
			display: flex;
			align-items: center;
			justify-content: center;
			overflow: hidden;
		}

		.item-img img {
			width: 100%;
			height: 100%;
			object-fit: cover;
		}

		.item-nombre {
			font-weight: 600;
			font-family: var(--fuente-marca);
			color: #ffffff;
		}

		.btn-back {
			color: rgba(255, 255, 255, 0.65);
			text-decoration: none;
			display: inline-flex;
			align-items: center;
			gap: 0.5rem;
			font-weight: 500;
			transition: color 0.2s;
		}

		.btn-back:hover {
			color: #ffffff;
		}

		/* ── Estado vacío con imagen de fondo ── */
		.vacio-banner {
			position: relative;
			border-radius: 16px;
			overflow: hidden;
			min-height: 420px;
			display: flex;
			align-items: center;
			justify-content: center;
			background: transparent;
			margin: -2rem;
			padding: 0;
			gap: 0;
		}

		.vacio-overlay {
			position: absolute;
			inset: 0;
			background: rgba(255, 255, 255, 0.07);
			backdrop-filter: blur(8px);
			-webkit-backdrop-filter: blur(8px);
			border: 1px solid rgba(255, 255, 255, 0.3);
		}

		.vacio-contenido {
			position: relative;
			z-index: 2;
			display: flex;
			flex-direction: column;
			align-items: center;
			gap: 0.85rem;
			padding: 3rem 2rem;
			text-align: center;
		}

		.vacio-icono {
			width: 72px;
			height: 72px;
			border-radius: 50%;
			background: rgba(255,255,255,0.15);
			border: 2px solid rgba(255,255,255,0.3);
			display: flex;
			align-items: center;
			justify-content: center;
			font-size: 1.8rem;
			color: #ffffff;
			backdrop-filter: blur(6px);
			margin-bottom: 0.5rem;
		}

		.vacio-titulo {
			font-family: var(--fuente-marca);
			font-size: 1.5rem;
			font-weight: 700;
			color: #ffffff;
			text-shadow: 0 2px 16px rgba(0,0,0,0.6);
		}

		.vacio-texto {
			font-size: 0.95rem;
			color: rgba(255,255,255,0.90);
			max-width: 360px;
			line-height: 1.6;
			text-shadow: 0 1px 8px rgba(0,0,0,0.5);
		}

		.vacio-btn {
			display: inline-flex;
			align-items: center;
			gap: 0.5rem;
			padding: 0.75rem 1.75rem;
			background: var(--menta);
			color: #ffffff;
			border-radius: 10px;
			text-decoration: none;
			font-size: 0.9rem;
			font-weight: 700;
			font-family: var(--fuente-marca);
			margin-top: 0.5rem;
			transition: background 0.2s, transform 0.2s;
			box-shadow: 0 4px 18px rgba(46,196,182,0.4);
		}

		.vacio-btn:hover {
			background: var(--menta-oscuro);
			transform: translateY(-2px);
		}
	</style>
</head>

<body>

	<header th:replace="~{common/navfooter :: navbar}"></header>

	<main class="tienda-container">

		<div class="tienda-header">
			<div>
				<h1 class="tienda-titulo">Historial de Compras</h1>
				<p class="tienda-subtitulo">Revisa los productos que has comprado anteriormente.</p>
			</div>
			<a th:href="@{/tienda}" class="btn-back">
				<i class="fa-solid fa-arrow-left"></i> Volver a la tienda
			</a>
		</div>

		<!-- Alerta de Éxito -->
		<div th:if="${mensaje}" style="background: #ecfdf5; color: #047857; padding: 1rem; border-radius: 10px; border-left: 5px solid #10b981; margin-bottom: 1.5rem; display: flex; align-items: center; gap: 0.8rem;">
			<i class="fa-solid fa-check-circle"></i>
			<span th:text="${mensaje}">Operación exitosa.</span>
		</div>

		<div class="historial-card">
			<div th:if="${#lists.isEmpty(compras)}" class="vacio-banner">
				<div class="vacio-overlay"></div>
				<div class="vacio-contenido">
<h2 class="vacio-titulo">Aún no has realizado compras</h2>
					<p class="vacio-texto">¡Explora nuestra tienda y descubre lo mejor para tu mascota!</p>
					<a th:href="@{/tienda}" class="vacio-btn">
						Ir a la tienda
					</a>
				</div>
			</div>

			<div th:if="${not #lists.isEmpty(compras)}">
				<table class="historial-table">
					<thead>
						<tr>
							<th>Fecha</th>
							<th>Producto</th>
							<th>Precio Pagado</th>
						</tr>
					</thead>
					<tbody>
						<tr th:each="compra : ${compras}">
							<td th:text="${#temporals.format(compra.fechaCompra, 'dd-MM-yyyy HH:mm')}">01-01-2026</td>
							<td>
								<div class="item-info">
									<div class="item-img">
										<img th:if="${not #strings.isEmpty(compra.producto.imagenUrl)}"
											th:src="${compra.producto.imagenUrl}" alt="Prod">
										<i th:unless="${not #strings.isEmpty(compra.producto.imagenUrl)}"
											class="fa-solid fa-box"></i>
									</div>
									<div>
										<span class="item-nombre" th:text="${compra.producto.nombre}">Nombre</span>
									</div>
								</div>
							</td>
							<td style="font-weight: 700; color: var(--menta-oscuro);" th:text="'€' + ${compra.precioPagado}">€0.00</td>
						</tr>
					</tbody>
				</table>
			</div>
		</div>

	</main>

	<footer th:replace="~{common/navfooter :: pie}"></footer>

</body>

</html>
