<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head>
	<meta charset="UTF-8">
	<link rel="icon" type="image/png" sizes="192x192" href="/img/favicons/android-chrome-512x512.png">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Mis Compras - SanityPet</title>
	<link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;500;600;700&family=Golos+Text:wght@400;500;600;700&display=swap" rel="stylesheet">
	<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
	<link rel="stylesheet" th:href="@{/css/common/navfooter.css}">
	<link rel="stylesheet" th:href="@{/css/tienda.css}">
	<style>
		:root {
			--menta: #2ec4b6;
			--menta-oscuro: #20968b;
			--fuente-marca: 'Quicksand', sans-serif;
			--fuente-base: 'Golos Text', sans-serif;
		}

		body {
			background-image: linear-gradient(to bottom, rgba(10,20,20,0.62) 0%, rgba(10,20,20,0.62) 12%, rgba(32,150,139,0.18) 35%), url('/img/portada/productos/p3.jpg');
			background-size: cover;
			background-position: center center;
			background-attachment: fixed;
			min-height: 100vh;
		}

		.historial-card {
			background: rgba(14, 60, 55, 0.55);
			backdrop-filter: blur(6px);
			-webkit-backdrop-filter: blur(6px);
			border: 1px solid rgba(46, 196, 182, 0.2);
			border-radius: 20px;
			padding: 2rem;
			margin-top: 2rem;
			box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
		}

		.historial-table {
			width: 100%;
			border-collapse: collapse;
			margin-bottom: 2rem;
		}

		.historial-table th {
			text-align: left;
			padding: 0.85rem 1rem;
			border-bottom: 1px solid rgba(255,255,255,0.15);
			color: rgba(255,255,255,0.55);
			text-transform: uppercase;
			font-size: 0.72rem;
			letter-spacing: 0.06em;
		}

		.historial-table td {
			padding: 1.25rem 1rem;
			border-bottom: 1px solid rgba(255,255,255,0.07);
			color: #ffffff;
		}

		.historial-table tbody tr:last-child td { border-bottom: none; }

		.item-info { display: flex; align-items: center; gap: 1rem; }

		.item-img {
			width: 50px; height: 50px;
			border-radius: 8px;
			background: rgba(255,255,255,0.08);
			border: 1px solid rgba(255,255,255,0.15);
			display: flex; align-items: center; justify-content: center;
			overflow: hidden;
		}

		.item-img img { width: 100%; height: 100%; object-fit: cover; }
		.item-img i { color: var(--menta); font-size: 1.2rem; }

		.item-nombre {
			font-weight: 600;
			font-family: var(--fuente-marca);
			color: #ffffff;
		}

		.btn-back {
			color: rgba(255,255,255,0.75);
			text-decoration: none;
			display: inline-flex;
			align-items: center;
			gap: 0.5rem;
			font-weight: 600;
			transition: color 0.2s;
		}

		.btn-back:hover { color: var(--menta); }

		.alerta-ok {
			background: rgba(4,120,87,0.2);
			color: #6ee7b7;
			padding: 1rem;
			border-radius: 10px;
			border-left: 5px solid #10b981;
			margin-bottom: 1.5rem;
			display: flex; align-items: center; gap: 0.8rem;
		}

		.vacio-banner {
			display: flex; flex-direction: column;
			align-items: center;
			padding: 4rem 2rem;
			gap: 1rem;
			text-align: center;
		}

		.vacio-icono {
			width: 72px; height: 72px;
			border-radius: 50%;
			background: rgba(46,196,182,0.15);
			border: 2px solid rgba(46,196,182,0.35);
			display: flex; align-items: center; justify-content: center;
			font-size: 1.8rem;
			color: var(--menta);
		}

		.vacio-titulo {
			font-family: var(--fuente-marca);
			font-size: 1.4rem; font-weight: 700;
			color: #ffffff;
			margin: 0;
		}

		.vacio-texto {
			font-size: 0.92rem;
			color: rgba(255,255,255,0.6);
			max-width: 340px; line-height: 1.6;
			margin: 0;
		}

		.vacio-btn {
			display: inline-flex; align-items: center; gap: 0.5rem;
			padding: 0.75rem 1.75rem;
			background: var(--menta); color: #ffffff;
			border-radius: 10px; text-decoration: none;
			font-weight: 700; font-family: var(--fuente-marca);
			font-size: 0.9rem; margin-top: 0.5rem;
			transition: background 0.2s;
		}

		.vacio-btn:hover { background: var(--menta-oscuro); }
	</style>
</head>

<body>

	<header th:replace="~{common/navfooter :: navbar}"></header>

	<main class="tienda-container">

		<div class="tienda-header">
			<div>
				<h1 class="tienda-titulo">Historial de Compras</h1>
				<p class="tienda-subtitulo">Revisa los productos que has comprado anteriormente.</p>
			</div>
			<a th:href="@{/tienda}" class="btn-back">
				<i class="fa-solid fa-arrow-left"></i> Volver a la tienda
			</a>
		</div>

		<!-- Alerta de Éxito -->
		<div th:if="${mensaje}" class="alerta-ok">
			<i class="fa-solid fa-check-circle"></i>
			<span th:text="${mensaje}">Operación exitosa.</span>
		</div>

		<div class="historial-card">

			<!-- Vacío -->
			<div th:if="${#lists.isEmpty(compras)}" class="vacio-banner">
				<div class="vacio-icono"><i class="fa-solid fa-bag-shopping"></i></div>
				<p class="vacio-titulo">Aún no has realizado compras</p>
				<p class="vacio-texto">Explora la tienda y encuentra lo mejor para tu mascota.</p>
				<a th:href="@{/tienda}" class="vacio-btn"><i class="fa-solid fa-store"></i> Ir a la tienda</a>
			</div>

			<!-- Tabla -->
			<div th:if="${not #lists.isEmpty(compras)}">
				<table class="historial-table">
					<thead>
						<tr>
							<th>Fecha</th>
							<th>Producto</th>
							<th>Precio Pagado</th>
						</tr>
					</thead>
					<tbody>
						<tr th:each="compra : ${compras}">
							<td th:text="${#temporals.format(compra.fechaCompra, 'dd/MM/yyyy HH:mm')}">01/01/2026</td>
							<td>
								<div class="item-info">
									<div class="item-img">
										<img th:if="${not #strings.isEmpty(compra.producto.imagenUrl)}"
											 th:src="${compra.producto.imagenUrl}" alt="Prod">
										<i th:unless="${not #strings.isEmpty(compra.producto.imagenUrl)}"
										   class="fa-solid fa-box"></i>
									</div>
									<span class="item-nombre" th:text="${compra.producto.nombre}">Nombre</span>
								</div>
							</td>
							<td style="font-weight: 700; color: #ffffff;" th:text="'€' + ${compra.precioPagado}">€0.00</td>
						</tr>
					</tbody>
				</table>
			</div>

		</div>

	</main>

	<footer th:replace="~{common/navfooter :: pie}"></footer>

</body>

</html>
